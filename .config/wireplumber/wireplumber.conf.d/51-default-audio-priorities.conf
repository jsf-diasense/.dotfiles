# Default audio sink priorities.
#
# Goal: Bluetooth headphones when connected, otherwise the laptop speakers.
# WirePlumber auto-picks the highest priority.session sink when the current
# default disappears. Out of the box the ThinkPad dock (1109) outranks the
# laptop Speaker (1000), so unplugging BT fell through to the dock instead of
# the speakers. Bluetooth is already highest (~2010) so it stays preferred.
#
# We simply raise the laptop Speaker above the dock (still below BT). Manual
# selection in pavucontrol still works for everything; this only changes which
# sink is auto-chosen as default.
#
# Node names came from: wpctl status  /  pw-dump. Reapply with:
#   systemctl --user restart wireplumber

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        priority.driver  = 1500
      }
    }
  }
  # Optional belt-and-suspenders: also push the DisplayLink dock below the
  # speakers so it never auto-selects even if the speaker node is absent.
  {
    matches = [
      { node.name = "~alsa_output.usb-DisplayLink.*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
        priority.driver  = 100
      }
    }
  }
]
